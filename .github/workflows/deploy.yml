name: Test and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          test -n "$EC2_HOST" || (echo "Missing GitHub secret: EC2_HOST" && exit 1)
          test -n "$EC2_USER" || (echo "Missing GitHub secret: EC2_USER" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "Missing GitHub secret: EC2_SSH_KEY" && exit 1)

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Fail early if the secret is not a valid private key.
          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null

          # Strict host-key checking is preferred in production. For this beginner
          # lab, accept the EC2 host key on first connection; verify the fingerprint
          # through a trusted channel for sensitive environments.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            'set -eu
             cd /opt/student-task-manager
             git pull --ff-only origin main
             docker compose up -d --build
             docker image prune -f
             docker compose ps'
